<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Words Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen">
    <div id="words-container" class="fixed inset-0 z-50 pointer-events-none select-none bg-yellow-200">
        <!-- Words will be added here by JavaScript -->
    </div>

    <div class="relative z-10 p-8">
        <h1 class="text-4xl font-bold text-white mb-4">Spinning Words Test</h1>
        <p class="text-white">Scroll to see the words spin!</p>
        <div class="h-screen"></div>
        <p class="text-white">Keep scrolling...</p>
        <div class="h-screen"></div>
        <p class="text-white">More scrolling...</p>
    </div>

    <script>
        const keywords = [
            "Intelligence", "Secure", "RAG", "Multilingual", "Insight",
            "Data", "Noetic", "Vault", "Analysis", "Query",
            "Vector", "Embeddings", "Language", "Knowledge", "Privacy",
            "Algorithms", "Document", "AI"
        ];

        const container = document.getElementById('words-container');
        const spans = [];

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Create words
        keywords.forEach((word, index) => {
            const top = randomRange(10, 90);
            const left = randomRange(10, 90);
            const initialRotation = randomRange(-30, 30);
            const rotationSpeed = randomRange(0.5, 2.0);

            const span = document.createElement('span');
            span.textContent = word;
            span.className = 'absolute font-bold text-6xl text-red-500 opacity-100 border-4 border-blue-500';
            span.style.top = `${top}%`;
            span.style.left = `${left}%`;
            span.style.transform = `rotate(${initialRotation}deg)`;
            span.style.userSelect = 'none';
            span.style.whiteSpace = 'nowrap';
            span.style.zIndex = '9999';

            container.appendChild(span);
            spans.push({
                el: span,
                rotationSpeed,
                initialRotation
            });
        });

        // Scroll handler
        function handleScroll() {
            const scrollY = window.scrollY;
            spans.forEach(({ el, rotationSpeed, initialRotation }) => {
                const rotate = initialRotation + scrollY * rotationSpeed;
                el.style.transform = `rotate(${rotate}deg)`;
            });
        }

        window.addEventListener('scroll', handleScroll, { passive: true });
    </script>
</body>
</html>
